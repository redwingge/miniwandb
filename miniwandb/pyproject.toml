[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniwandb-local"
version = "0.1.0"
description = "A small offline experiment tracker with a local web dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
wandb = ["wandb>=0.17,<0.27"]

[project.scripts]
miniwandb = "miniwandb.__main__:main"

[tool.setuptools.packages.find]
include = ["miniwandb*"]

[tool.setuptools.package-data]
miniwandb = ["static/*.html", "static/*.js", "static/*.css"]
